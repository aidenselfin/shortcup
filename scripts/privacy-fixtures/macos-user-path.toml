# Appended to .gitleaks.toml by the self-test only. Not loaded by the CI scan.
[[rules]]
id = "macos-user-path"
description = "macOS home directory other than runner or Shared"
regex = '''/Users/[A-Za-z0-9._-]+'''
keywords = ["Users"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''/Users/runner(?:/|$)''',
  '''/Users/Shared(?:/|$)''',
]
