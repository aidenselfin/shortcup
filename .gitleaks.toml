title = "shortcup privacy scan"

[extend]
useDefault = true

[[rules]]
id = "keychain-password-file"
description = "keychain password file"
path = '''(?:^|/)keychain-password$'''

[[rules]]
id = "macos-user-path"
description = "macOS home directory other than runner or Shared"
regex = '''/Users/[A-Za-z0-9._-]+'''
keywords = ["Users"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''/Users/runner(?:/|$)''',
  '''/Users/Shared(?:/|$)''',
]

[allowlist]
description = "Exact self-test fixture paths only. Each file contains the marker 'fake self-test fixture'."
paths = [
  '''^(?:\./)?scripts/privacy-fixtures/fake-private-key\.txt$''',
  '''^(?:\./)?scripts/privacy-fixtures/fake-user-path\.txt$''',
  '''^(?:\./)?scripts/privacy-fixtures/fake-github-token\.txt$''',
  '''^(?:\./)?scripts/privacy-fixtures/keychain-password$''',
  '''^(?:\./)?scripts/privacy-fixtures/clean-users-path\.txt$''',
]
