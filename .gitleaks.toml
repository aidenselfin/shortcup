title = "shortcup privacy scan"

[extend]
useDefault = true

[[rules]]
id = "keychain-password-file"
description = "keychain password file"
path = '''(?:^|/)keychain-password$'''

[[rules]]
id = "forbidden-filename"
description = "signing, keychain, environment, or Xcode user files"
path = '''(?i)(?:\.(?:p12|pem|key|cer|p8|pfx|mobileprovision|provisionprofile|keychain|keychain-db|certsigningrequest)$|(?:^|/)\.env(?:\..*)?$|(?:^|/)xcuserdata/|(?:^|/)\.config/shortcup/|(?:^|/)validation-(?:events|state|results)[^/]*$|(?:^|/)validation-fixtures/)'''

# Home directories in any spelling: slash or backslash, JSON-escaped, any letter case,
# and non-ASCII names. Dot and dot-dot segments are folded before the username is
# checked, so they cannot hide a personal home path behind Shared or runner.
# Only runner and Shared are allowed as that username. The secret group leaves out
# the leading slash so the default config's allowlist for plain Unix paths never applies.
[[rules]]
id = "macos-user-path"
description = "home directory other than runner or Shared"
regex = '''(?i)[/\\]+(users(?:[/\\]+[^\s/\\"'<>:;,|(){}*$?=&#%!@+~\x60\[]+)+)'''
secretGroup = 1
keywords = ["users"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)[/\\]+users(?:[/\\]+\.)*[/\\]+(?:runner|shared)(?:[/\\]+(?:\.|[.][^./\\][^/\\]*|[^.][^/\\]*))*$''',
  '''(?i)[/\\]+users(?:[/\\]+\.)+$''',
]

[[rules]]
id = "home-path"
description = "Linux home directory other than runner"
regex = '''(?i)[/\\]+(home(?:[/\\]+[^\s/\\"'<>:;,|(){}*$?=&#%!@+~\x60\[]+)+)'''
secretGroup = 1
keywords = ["home"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)[/\\]+home(?:[/\\]+\.)*[/\\]+runner(?:[/\\]+(?:\.|[.][^./\\][^/\\]*|[^.][^/\\]*))*$''',
  '''(?i)[/\\]+home(?:[/\\]+\.)+$''',
]

[[rules]]
id = "owner-device"
description = "owner name followed by a device name"
regex = '''(?:의|'s|’s) (?:Mac|MacBook|iMac|iPhone|iPad)'''
keywords = ["mac", "iphone", "ipad"]

[[rules]]
id = "host-device"
description = "default macOS host name with a person-like prefix"
regex = '''(?i)[A-Za-z0-9]+-(?:MacBook|iMac|Mac-mini|Mac-Studio|Mac-Pro|iPhone|iPad)(?:-Pro|-Air)?(?:\.local)?'''
keywords = ["macbook", "imac", "mac-mini", "mac-studio", "mac-pro", "iphone", "ipad"]

