# SAFE Shortcup checks on macos-26. The live script is not invoked.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SAFE verify
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned ripgrep and pcre2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION=14.1.1
          ARCHIVE="ripgrep-${VERSION}-aarch64-apple-darwin.tar.gz"
          URL="https://github.com/BurntSushi/ripgrep/releases/download/${VERSION}/${ARCHIVE}"
          SHA256=24ad76777745fbff131c8fbc466742b011f925bfa4fffa2ded6def23b5b937be
          TMP="$(/usr/bin/mktemp)"
          /usr/bin/curl -sSL -o "$TMP" "$URL"
          echo "${SHA256}  ${TMP}" | /usr/bin/shasum -a 256 -c -
          /usr/bin/tar -xzf "$TMP" -C /tmp
          DEST=/opt/homebrew/bin
          if [[ ! -d "$DEST" ]]; then
            DEST=/usr/local/bin
            /bin/mkdir -p "$DEST"
          fi
          /bin/cp "/tmp/ripgrep-${VERSION}-aarch64-apple-darwin/rg" "$DEST/rg"
          /bin/chmod 755 "$DEST/rg"
          # Official darwin rg links Homebrew pcre2. Install pinned 10.45 when missing.
          PCRE2_PREFIX=/opt/homebrew/opt/pcre2
          if [[ ! -d /opt/homebrew ]]; then
            PCRE2_PREFIX=/usr/local/opt/pcre2
          fi
          if [[ ! -f "${PCRE2_PREFIX}/lib/libpcre2-8.0.dylib" ]]; then
            PCRE2_VERSION=10.45
            PCRE2_ARCHIVE="pcre2-${PCRE2_VERSION}.tar.bz2"
            PCRE2_URL="https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/${PCRE2_ARCHIVE}"
            PCRE2_SHA256=21547f3516120c75597e5b30a992e27a592a31950b5140e7b8bfde3f192033c4
            PCRE2_TMP="$(/usr/bin/mktemp)"
            /usr/bin/curl -sSL -o "$PCRE2_TMP" "$PCRE2_URL"
            echo "${PCRE2_SHA256}  ${PCRE2_TMP}" | /usr/bin/shasum -a 256 -c -
            /usr/bin/tar -xjf "$PCRE2_TMP" -C /tmp
            (
              cd "/tmp/pcre2-${PCRE2_VERSION}"
              ./configure --prefix=/tmp/pcre2-${PCRE2_VERSION}-prefix --enable-shared --disable-static
              /usr/bin/make -j"$(/usr/sbin/sysctl -n hw.ncpu)"
              /usr/bin/make install
            )
            /bin/mkdir -p "${PCRE2_PREFIX}/lib"
            /bin/cp "/tmp/pcre2-${PCRE2_VERSION}-prefix/lib/libpcre2-8.0.dylib" "${PCRE2_PREFIX}/lib/libpcre2-8.0.dylib"
            /usr/bin/install_name_tool -id "${PCRE2_PREFIX}/lib/libpcre2-8.0.dylib" "${PCRE2_PREFIX}/lib/libpcre2-8.0.dylib"
          fi

      - name: SAFE verify
        timeout-minutes: 10
        env:
          SHORTCUP_ESLOGGER: "1"
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/watch-processes.py -- /bin/zsh -f verify.sh
