# SAFE Shortcup checks on macos-26. The live script is not invoked.

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SAFE verify
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: SAFE verify
        timeout-minutes: 18
        run: |
          set -euo pipefail
          if [[ ! -x /opt/homebrew/bin/rg && ! -x /usr/local/bin/rg && ! -x /usr/bin/rg ]]; then
            brew install ripgrep
          fi
          /usr/bin/python3 scripts/watch-processes.py -- /bin/zsh -f verify.sh
