name: privacy-scan

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RANGE_BEFORE: ${{ github.event.before }}
      RANGE_AFTER: ${{ github.event.after }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl -fsSL -o "$work/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          curl -fsSL -o "$work/checksums.txt" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          (
            cd "$work"
            grep -F " ${asset}" checksums.txt | sha256sum -c -
          )
          actual=$(sha256sum "$work/$asset" | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo "checksum-mismatch" >&2
            exit 1
          fi
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$install_dir"
          tar -xzf "$work/$asset" -C "$install_dir" gitleaks
          chmod +x "$install_dir/gitleaks"
          "$install_dir/gitleaks" version | grep -qx "$version"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Self-test
        run: |
          set -euo pipefail
          bash scripts/privacy-check-selftest.sh

      - name: Gitleaks
        run: |
          set -euo pipefail
          bash scripts/privacy-check.sh --ci --gitleaks

      - name: Privacy check
        run: |
          set -euo pipefail
          bash scripts/privacy-check.sh --ci
