# Measure AXRole/AXSubrole under Safari's tab strip and Finder's toolbar
# on a GitHub macos-26 runner. Shortcup is not built or launched. No --live.
# JSON is role, subrole, depth, and child index only. No titles, values,
# URLs, descriptions, window names, file names, or paths.
# If Accessibility is off, record trusted=false, close the windows, and end.

name: ax-role-probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ax-role-probe.yml"
      - "scripts/ax-role-probe.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax-role-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: macos-26 AX roles
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile probe
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sdk="$(xcrun --show-sdk-path)"
          swiftc -sdk "$sdk" -framework ApplicationServices -framework AppKit \
            -o "${RUNNER_TEMP}/ax-role-probe" scripts/ax-role-probe.swift

      - name: Open Safari and Finder
        timeout-minutes: 2
        run: |
          set -euo pipefail
          /usr/bin/open -a Safari about:blank || true
          /bin/sleep 3
          /usr/bin/open -a Safari about:blank || true
          /usr/bin/osascript -e 'tell application "Finder" to activate' \
            -e 'tell application "Finder" to make new Finder window' || true
          /bin/sleep 3

      - name: Probe AX roles
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p build
          "${RUNNER_TEMP}/ax-role-probe" build/ax-role-probe.json

      - name: Refuse content in JSON
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path("build/ax-role-probe.json")
          ok = False
          try:
              text = path.read_text()
              if re.search(r"(?i)(/Users/|/home/|about:blank|file:)", text):
                  raise SystemExit("refusing to publish content-bearing JSON")

              allowed = {
                  "trusted", "reason", "macos", "arch", "safari", "finder",
                  "running", "windowCount", "tabStrip", "toolbar", "chrome",
                  "truncated", "axError", "role", "subrole", "depth", "index",
                  "children",
              }
              safe = re.compile(
                  r"^(AX[A-Za-z0-9]+|ok|trusted=false|safari-not-running|"
                  r"finder-not-running|no-safari-window|no-finder-window|"
                  r"no-tab-strip|no-toolbar|arm64|x86_64|unknown|\d+(\.\d+)*)$"
              )

              def walk(obj):
                  if isinstance(obj, dict):
                      extra = set(obj) - allowed
                      if extra:
                          raise SystemExit("unexpected key")
                      for value in obj.values():
                          walk(value)
                  elif isinstance(obj, list):
                      for value in obj:
                          walk(value)
                  elif isinstance(obj, str):
                      if not safe.match(obj):
                          raise SystemExit("unsafe string")
                  elif not isinstance(obj, (bool, int)) and obj is not None:
                      raise SystemExit("unexpected type")

              walk(json.loads(text))
              ok = True
              print("json=ok")
          finally:
              if not ok:
                  path.unlink(missing_ok=True)
          PY

      - name: Upload role JSON
        if: success()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ax-role-probe
          path: build/ax-role-probe.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

      - name: Summarize roles
        if: success()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if [[ -f build/ax-role-probe.json ]]; then
            {
              echo "### AX role probe"
              echo
              echo '```'
              cat build/ax-role-probe.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close Safari and Finder windows
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          /usr/bin/killall Safari || true
          /usr/bin/osascript -e 'tell application "Finder" to close every window' || true
